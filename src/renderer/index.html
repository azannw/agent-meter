<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agent Meter</title>
  <link rel="stylesheet" href="styles.css">
  <script src="boot.js"></script>
</head>
<body>
  <!-- The window is transparent; the 12 px margin around the panel holds its shadow (CONTRACT 8).
       The panel is information only: Refresh, Start with Windows and Quit live in the tray icon's menu. -->
  <div class="frame">
    <div class="panel is-concealed" id="app">
      <header class="top" id="top">
        <!-- Filled by app.js, only when two or more providers have data. -->
        <div class="tabs" id="tabs" role="tablist" aria-label="View" hidden></div>
        <div id="hero" hidden></div>
      </header>

      <main class="scroller" id="scroller">
        <div class="content" id="content"></div>
      </main>
    </div>
  </div>

  <script src="format.js"></script>
  <script src="../shared/limit-rules.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
